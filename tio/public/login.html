<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — TryItOn!</title>

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/buttons.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="icon" type="image/png" href="/images/avatar/logo.png" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <main>
    <div class="auth-card card glass reveal">
      <div class="text-center mb-6">
        <div class="navbar__brand" style="justify-content:center;margin-bottom:16px">
          <span class="navbar__logo">T</span> TryItOn!
        </div>
        <h1 class="page-title">Welcome back</h1>
        <p class="text-muted mt-2">Log in to continue designing.</p>
      </div>

      <!-- Server-side error banner -->
      <div class="alert alert--error" id="authAlert" role="alert"></div>

      <form id="loginForm" action="/auth/login" method="POST" novalidate>
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input class="field__input" type="email" id="email" name="email"
                 autocomplete="email" placeholder="you@example.com" required />
          <p class="field__error">Please enter a valid email address.</p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input class="field__input" type="password" id="password" name="password"
                 autocomplete="current-password" placeholder="••••••••" required />
          <p class="field__error">Please enter your password.</p>
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg" id="submitBtn">
          Log in
        </button>
      </form>

      <hr class="divider" />
      <p class="text-center text-sm text-muted">
        New here?
        <a href="/register" class="text-accent fw-semibold">Create an account</a>
      </p>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/auth.js"></script>
</body>
</html>
