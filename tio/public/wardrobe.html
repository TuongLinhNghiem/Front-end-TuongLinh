<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wardrobe — TryItOn!</title>

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/buttons.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/avatar.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="icon" type="image/png" href="/images/avatar/logo.png" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="page">
      <div class="page-header reveal">
        <div>
          <h1 class="page-title">My Wardrobe</h1>
          <p class="page-subtitle">Every outfit you've saved, ready to edit, duplicate or delete.</p>
        </div>
        <a href="/design" class="btn btn--primary">+ New outfit</a>
      </div>

      <!-- Outfit count -->
      <p class="text-muted text-sm reveal" data-delay="1" id="outfitCount"></p>

      <!-- Outfit grid -->
      <div class="wardrobe-grid" id="wardrobeGrid"></div>

      <!-- Empty state -->
      <div class="wardrobe-empty reveal" id="wardrobeEmpty" hidden>
        <div class="wardrobe-empty__icon">👗</div>
        <h3>Your wardrobe is empty</h3>
        <p>Design your first outfit and it will appear here.</p>
        <a href="/design" class="btn btn--primary mt-5">Design an outfit →</a>
      </div>
    </section>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components/avatar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/wardrobe.js"></script>
</body>
</html>
