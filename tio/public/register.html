<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your account — TryItOn!</title>

  <link rel="icon" type="image/png" href="/images/avatar/logo.png" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/buttons.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
  <link rel="stylesheet" href="/css/pages.css" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="page">
      <div class="auth-card glass">
        <div class="text-center mb-6">
          <span class="navbar__logo" style="display:inline-grid;margin-bottom:16px">T</span>
          <h1 class="page-title">Create your account</h1>
          <p class="text-muted mt-2">Start designing outfits in seconds.</p>
        </div>

        <!-- Server-side error / info banner -->
        <div class="alert alert--error" id="authAlert" role="alert"></div>

        <!-- The form posts to /auth/register (progressive enhancement) -->
        <form id="registerForm" action="/auth/register" method="POST" novalidate>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="field__input" type="email" id="email" name="email"
                   autocomplete="email" placeholder="you@example.com" required />
            <p class="field__error">Please enter a valid email address.</p>
          </div>

          <div class="field">
            <label class="field__label" for="username">Username</label>
            <input class="field__input" type="text" id="username" name="username"
                   autocomplete="username" placeholder="your_name" minlength="3" required />
            <p class="field__hint">At least 3 characters.</p>
            <p class="field__error">Username must be at least 3 characters.</p>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <input class="field__input" type="password" id="password" name="password"
                   autocomplete="new-password" minlength="8" required />
            <p class="field__hint">At least 8 characters.</p>
            <p class="field__error">Password must be at least 8 characters.</p>
          </div>

          <div class="field">
            <label class="field__label" for="confirmPassword">Confirm Password</label>
            <input class="field__input" type="password" id="confirmPassword"
                   name="confirmPassword" autocomplete="new-password" minlength="8" required />
            <p class="field__error">Passwords do not match.</p>
          </div>

          <button type="submit" class="btn btn--primary btn--block btn--lg" id="submitBtn">
            Create account
          </button>
        </form>

        <p class="text-center text-muted text-sm mt-6">
          Already have an account? <a href="/login" class="text-accent fw-semibold">Log in</a>
        </p>
      </div>
    </section>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/register.js"></script>
</body>
</html>
