<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — TryItOn!</title>

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/buttons.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="icon" type="image/png" href="/images/avatar/logo.png" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="page">
      <div class="page-header reveal">
        <h1 class="page-title">Profile</h1>
        <p class="page-subtitle">Your account details and body measurements.</p>
      </div>

      <!-- Identity card -->
      <div class="card reveal" data-delay="1">
        <div class="profile-card">
          <div class="profile-avatar" id="profileAvatar">T</div>
          <div>
            <h2 id="profileUsername" class="page-title">—</h2>
            <p id="profileEmail" class="text-muted mt-2">—</p>
            <div class="mt-4 flex gap-2">
              <button class="btn btn--ghost btn--sm" id="editBtn">Edit profile</button>
              <a href="/auth/logout" class="btn btn--danger btn--sm">Log out</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Details -->
      <div class="profile-list reveal" data-delay="2">
        <div class="profile-field">
          <div class="profile-field__label">Member since</div>
          <div class="profile-field__value" id="profileSince">—</div>
        </div>
        <div class="profile-field">
          <div class="profile-field__label">Saved outfits</div>
          <div class="profile-field__value" id="profileOutfits">—</div>
        </div>
        <div class="profile-field">
          <div class="profile-field__label">Body measurements</div>
          <div class="profile-field__value" id="profileMeasurements">Not set</div>
        </div>
        <div class="profile-field">
          <div class="profile-field__label">Avatar status</div>
          <div class="profile-field__value">Placeholder</div>
        </div>
      </div>

      <!-- Edit modal -->
      <div class="modal" id="editModal" hidden>
        <div class="modal__backdrop" data-close></div>
        <div class="modal__panel glass">
          <h3 class="mb-4">Edit profile</h3>
          <form id="editForm">
            <div class="field">
              <label class="field__label" for="editUsername">Username</label>
              <input class="field__input" type="text" id="editUsername" name="username" minlength="3" />
            </div>
            <div class="field">
              <label class="field__label">Body measurements (placeholder)</label>
              <div class="grid grid--3">
                <input class="field__input" type="text" id="m_chest"  placeholder="Chest (cm)" inputmode="numeric" />
                <input class="field__input" type="text" id="m_waist"  placeholder="Waist (cm)" inputmode="numeric" />
                <input class="field__input" type="text" id="m_hip"    placeholder="Hip (cm)"   inputmode="numeric" />
              </div>
              <p class="field__hint">Demo only — measurements are stored as JSON.</p>
            </div>
            <div class="flex gap-3 mt-6">
              <button type="submit" class="btn btn--primary">Save changes</button>
              <button type="button" class="btn btn--ghost" data-close>Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/profile.js"></script>
</body>
</html>
